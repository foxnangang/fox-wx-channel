# Fox-wx-channel 配置示例
# 复制为 config.yaml 后修改；程序首次运行会自动写入证书路径等字段，可能重写格式。
# 路径中可使用 %UserDownloads% 表示系统“下载”文件夹，%CWD% 表示程序所在目录。

# 运行时工作目录；留空表示使用程序安装目录
workdir: ""

download:
  # 视频保存目录。可改为绝对路径，例如 D:\素材\视频下载
  dir: "%UserDownloads%"
  # 文件名模板，可用变量：filename / id / title / spec / created_at / download_at / author
  filenameTemplate: "{{filename}}_{{spec}}"
  # 同时下载的任务数
  maxRunning: 3
  # 是否播放完成提示音
  playDoneAudio: true

proxy:
  enabled: true
  system: true
  hostname: "127.0.0.1"
  # 代理端口；微信视频号流量经此端口
  port: 2023

api:
  protocol: "http"
  hostname: "127.0.0.1"
  # 本地管理页面端口
  port: 2022

mcp:
  enabled: false

# 已关闭自动更新，避免覆盖本自用改造版本
update:
  sources:
    - type: github
      priority: 1
      github_repo: ""
      manifest_url: ""
      self_url: ""
      enabled: false
      need_check_checksum: true
